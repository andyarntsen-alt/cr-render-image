name: build
on:
  push:
    branches: [main]
    paths: [Dockerfile, "fonts/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        default: 5.2.2-1
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cr-blender
  TAG: ${{ inputs.tag || '5.2.2-1' }}
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      - name: smoke test
        run: |
          I=$IMAGE:$TAG
          docker run --rm $I /opt/blender/blender --version | grep d13f752e3b9c
          docker run --rm $I bash -c 'test -s /usr/share/glvnd/egl_vendor.d/10_nvidia.json && test -s /usr/share/vulkan/icd.d/nvidia_icd.json && test -s /opt/cr/image.json && ffmpeg -version | head -1 && python3 -c "import numpy, PIL; print(numpy.__version__, PIL.__version__)" && runpodctl --version && croc --version && ls /opt/cr/fonts/d-din && cat /opt/cr/image.json'
          docker image ls $I
      - name: push
        run: docker push $IMAGE:$TAG
      - name: size
        run: docker buildx imagetools inspect $IMAGE:$TAG
